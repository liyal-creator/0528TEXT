  <style>
    :root {
      --primary: #44D564;
      --primary-light: #E8F3FF;
      --success: #00B42A;
      --warning: #FF7D00;
      --danger: #F53F3F;
      --text-primary: #1D2129;
      --text-secondary: #4E5969;
      --text-tertiary: #86909C;
      --border: #C9CDD4;
      --bg-page: #F2F3F5;
      --bg-white: #FFFFFF;
      --text-inverse: #FFFFFF;
      --bg-soft: #F7F8FA;
      --mask: rgba(0, 0, 0, 0.5);
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-navbar: 0 1px 4px rgba(0, 0, 0, 0.05);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --font-h1: 24px;
      --line-h1: 32px;
      --font-h2: 20px;
      --line-h2: 28px;
      --font-h3: 18px;
      --line-h3: 24px;
      --font-body: 16px;
      --line-body: 24px;
      --font-caption: 14px;
      --line-caption: 20px;
      --font-small: 12px;
      --line-small: 16px;
      --space-4: 4px;
      --space-8: 8px;
      --space-16: 16px;
      --space-24: 24px;
      --space-32: 32px;
    }

    body.theme-dark {
      --text-primary: #F7F8FC;
      --text-secondary: #D7DCE5;
      --text-tertiary: #A8B0BD;
      --border: #3D4656;
      --bg-page: #10131A;
      --bg-white: #171B24;
      --bg-soft: #202633;
      --primary-light: #1E3326;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.24);
      --shadow-navbar: 0 1px 4px rgba(0, 0, 0, 0.32);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-family);
      -webkit-text-size-adjust: 100%;
    }

    body {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    input,
    textarea {
      user-select: text;
      -webkit-user-select: text;
      -webkit-touch-callout: default;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .navbar-main {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--space-16);
      background: var(--bg-white);
      box-shadow: var(--shadow-navbar);
    }

    .navbar-title {
      margin: 0;
      color: var(--text-primary);
      font-size: 17px;
      line-height: 24px;
      font-weight: 600;
      text-align: center;
    }

    .page-creator {
      width: 100%;
      max-width: 768px;
      margin: 0 auto;
      padding: var(--space-16) var(--space-16) var(--space-32);
    }

    .section-hero,
    .section-topics,
    .section-creators,
    .section-closing {
      margin-bottom: var(--space-24);
    }

    .card-default {
      background: var(--bg-white);
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--shadow-card);
    }

    .hero-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-16);
    }

    .tag-default {
      height: 24px;
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 0 var(--space-8);
      border-radius: 4px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: var(--font-small);
      line-height: var(--line-small);
      font-weight: 400;
      white-space: nowrap;
    }

    .hero-title {
      margin: 0;
      color: var(--text-primary);
      font-size: var(--font-h1);
      line-height: var(--line-h1);
      font-weight: 600;
    }

    .hero-desc {
      margin: 0;
      color: var(--text-secondary);
      font-size: var(--font-body);
      line-height: var(--line-body);
      font-weight: 400;
    }

    .hero-actions {
      display: flex;
      gap: var(--space-8);
      flex-wrap: wrap;
    }

    .btn-primary,
    .btn-secondary {
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 80px;
      padding: 0 var(--space-24);
      font-size: var(--font-body);
      line-height: var(--line-body);
      font-weight: 600;
      transition: opacity 200ms ease-out, transform 200ms ease-out;
      border: 0;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--bg-white);
    }

    .btn-secondary {
      background: var(--bg-white);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }

    .btn-primary:active,
    .btn-secondary:active {
      transform: scale(0.98);
    }

    .stats-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-8);
    }

    .stat-item {
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--space-8);
      border-radius: 12px;
      background: var(--bg-soft);
    }

    .stat-value {
      color: var(--text-primary);
      font-size: var(--font-h3);
      line-height: var(--line-h3);
      font-weight: 600;
    }

    .stat-label {
      margin-top: var(--space-4);
      color: var(--text-tertiary);
      font-size: var(--font-small);
      line-height: var(--line-small);
      font-weight: 400;
    }

    .section-title-block {
      margin-bottom: var(--space-16);
    }

    .section-title {
      margin: 0;
      color: var(--text-primary);
      font-size: var(--font-h2);
      line-height: var(--line-h2);
      font-weight: 600;
    }

    .section-desc {
      margin: var(--space-4) 0 0;
      color: var(--text-secondary);
      font-size: var(--font-caption);
      line-height: var(--line-caption);
      font-weight: 400;
    }

    .topic-scroll {
      display: flex;
      gap: var(--space-8);
      overflow-x: auto;
      padding-bottom: var(--space-8);
      scrollbar-width: none;
    }

    .topic-scroll::-webkit-scrollbar {
      display: none;
    }

    .topic-chip {
      height: 32px;
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      padding: 0 12px;
      border-radius: 80px;
      border: 1px solid var(--border);
      background: var(--bg-white);
      color: var(--text-secondary);
      font-size: var(--font-caption);
      line-height: var(--line-caption);
      font-weight: 500;
      white-space: nowrap;
    }

    .topic-chip.is-active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-16);
      margin-top: var(--space-8);
    }

    .topic-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-8);
    }

    .icon-line {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary);
    }

    .icon-line svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2px;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .topic-title {
      margin: 0;
      color: var(--text-primary);
      font-size: var(--font-caption);
      line-height: var(--line-caption);
      font-weight: 600;
    }

    .topic-desc {
      margin: 0;
      color: var(--text-secondary);
      font-size: var(--font-caption);
      line-height: var(--line-caption);
      font-weight: 400;
    }

    .creator-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-16);
    }

    .creator-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-16);
      padding: var(--space-24) var(--space-16);
      text-align: center;
    }

    .creator-top {
      width: 100%;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      gap: var(--space-8);
    }

    .creator-rank,
    .creator-rank-spacer {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
    }

    .creator-rank {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--primary);
      border-radius: 80px;
      color: var(--text-inverse);
      background: var(--primary);
      font-size: var(--font-body);
      line-height: var(--line-body);
      font-weight: 500;
    }

    .creator-profile {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .creator-avatar {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border-radius: 80px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: var(--font-h2);
      line-height: var(--line-h2);
      font-weight: 600;
      overflow: hidden;
    }

    .creator-avatar-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 80px;
    }

    .creator-name {
      margin: 0;
      color: var(--text-primary);
      font-size: var(--font-h3);
      line-height: var(--line-h3);
      font-weight: 500;
      text-align: center;
      word-break: break-word;
    }

    .creator-role {
      margin-top: var(--space-4);
      color: var(--text-tertiary);
      font-size: var(--font-caption);
      line-height: var(--line-caption);
      font-weight: 400;
    }

    .creator-desc {
      margin: 0;
      color: var(--text-primary);
      font-size: var(--font-body);
      line-height: var(--line-body);
      font-weight: 400;
      text-align: center;
    }

    .creator-reason {
      padding: var(--space-16);
      border-radius: 12px;
      background: var(--bg-soft);
    }

    .reason-label {
      display: block;
      color: var(--text-tertiary);
      font-size: var(--font-small);
      line-height: var(--line-small);
      font-weight: 400;
    }

    .reason-text {
      display: block;
      margin-top: var(--space-4);
      color: var(--text-secondary);
      font-size: var(--font-caption);
      line-height: var(--line-caption);
      font-weight: 400;
    }

    .creator-link {
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--space-24);
      border: 1px solid var(--primary);
      border-radius: 80px;
      color: var(--text-inverse);
      background: var(--primary);
      font-size: var(--font-body);
      line-height: var(--line-body);
      font-weight: 600;
    }

    .creator-link-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .creator-link-arrow {
      display: none;
    }

    .closing-card {
      text-align: center;
    }

    .closing-title {
      margin: 0;
      color: var(--text-primary);
      font-size: var(--font-h2);
      line-height: var(--line-h2);
      font-weight: 600;
    }

    .closing-desc {
      margin: var(--space-8) 0 0;
      color: var(--text-secondary);
      font-size: var(--font-body);
      line-height: var(--line-body);
      font-weight: 400;
    }

    .closing-action {
      display: flex;
      justify-content: center;
      margin-top: var(--space-16);
    }

    @media (min-width: 768px) {
      .page-creator {
        padding-top: var(--space-24);
        padding-bottom: var(--space-32);
      }

      .hero-card {
        padding: var(--space-16);
      }

      .creator-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-16);
      }

      .creator-card {
        min-height: auto;
      }
    }
  </style>
</head>

        return text[lang][key] || text.en[key] || '';
      }

      function categoryFor(key) {
        return categoryCopy[lang][key] || categoryCopy.en[key] || key;
      }

      function createSvg(type) {
        if (type === 'early') return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"></path></svg>';
        if (type === 'market') return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16"></path><path d="M6 14l4-4 3 3 5-7"></path></svg>';
        if (type === 'ai') return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16"></path><path d="M4 12h16"></path><path d="M7 7h10v10H7z"></path></svg>';
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14"></path><path d="M5 12h14"></path><path d="M5 17h10"></path></svg>';
      }

      function applyText() {
        document.title = textFor('title');
        var nodes = document.querySelectorAll('[data-i18n]');
        nodes.forEach(function (node) {
          node.textContent = textFor(node.getAttribute('data-i18n'));
        });
      }

      function renderTopics() {
        var chipWrap = document.getElementById('topicChips');
        var chips = ['all', 'cryptocurrency', 'ai', 'market', 'project', 'web3_news', 'opportunities'];
        chipWrap.innerHTML = chips.map(function (key, index) {
          return '<span class="topic-chip' + (index === 0 ? ' is-active' : '') + '">' + categoryFor(key) + '</span>';
        }).join('');

        var topics = text[lang].topics || text.en.topics;
        var cards = [
          { key: 'early', icon: 'early' },
          { key: 'market', icon: 'market' },
          { key: 'ai', icon: 'ai' },
          { key: 'insight', icon: 'insight' }
        ];
        document.getElementById('topicCards').innerHTML = cards.map(function (item) {
          var copy = topics[item.key];
          return '<article class="card-default topic-card">' +
            '<span class="icon-line">' + createSvg(item.icon) + '</span>' +
            '<h3 class="topic-title">' + copy[0] + '</h3>' +
            '<p class="topic-desc">' + copy[1] + '</p>' +
          '</article>';
        }).join('');
      }

      function renderCreators() {
        var list = document.getElementById('creatorList');
        list.innerHTML = creators.map(function (creator, index) {
          return '<a class="card-default creator-card" href="' + creator.url + '" target="_blank" rel="noopener noreferrer">' +
            '<div class="creator-top">' +
              '<span class="creator-rank">' + (index + 1) + '</span>' +
              '<div class="creator-profile">' +
                '<span class="creator-avatar">' + (creator.avatarImage ? '<img class="creator-avatar-img" src="' + creator.avatarImage + '" alt="' + creator.name + '" />' : creator.avatar) + '</span>' +
              '</div>' +
              '<span class="creator-rank-spacer"></span>' +
            '</div>' +
            '<h3 class="creator-name">' + creator.name + '</h3>' +
            '<p class="creator-desc">' + creator.desc[lang] + '</p>' +
            '<div class="creator-link">' +
              '<span class="creator-link-text">' + textFor('enterChannel') + '</span>' +
              '<span class="creator-link-arrow">›</span>' +
            '</div>' +
          '</a>';
        }).join('');
      }

      function blockDefaultBehaviors() {
        document.addEventListener('contextmenu', function (event) {
          var tagName = event.target.tagName.toLowerCase();
          if (tagName !== 'input' && tagName !== 'textarea') event.preventDefault();
        });
        document.addEventListener('gesturestart', function (event) {
          event.preventDefault();
        });
      }

      applyText();
      renderCreators();
      blockDefaultBehaviors();
    }());
  </script>
</body>
</html>
